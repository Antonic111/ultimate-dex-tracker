<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/SiteLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Dex Tracker</title>

  <!-- Google Fonts for Streamer Overlay & UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Pixelify+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800;900&family=Press+Start+2P&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Preload Critical Landing Font to Prevent Layout Shift -->
  <link rel="preload" href="/landing_page/BowlbyOne-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Ultimate Dex Tracker is a free Pokémon tracker to build your living dex, track shinies, forms, and progress across every game. Track 2064+ Pokémon in one place." />
  <meta name="keywords"
    content="Pokemon, Pokémon, Living Dex, Pokedex, Pokemon Tracker, Shiny Tracker, Pokemon Collection, National Dex, Pokemon Games" />
  <meta name="author" content="Antonic" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.ultimatedextracker.com/" />

  <!-- Open Graph Meta Tags for Social Sharing -->
  <meta property="og:title" content="Ultimate Dex Tracker" />
  <meta property="og:description"
    content="A free Pokémon tracker to build your living dex, track shinies, forms, and progress across every game. Track 2064+ Pokémon in one place." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/SiteLogo.png" />
  <meta property="og:url" content="https://www.ultimatedextracker.com/" />
  <meta property="og:site_name" content="Ultimate Dex Tracker" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ultimate Dex Tracker" />
  <meta name="twitter:description"
    content="A free Pokémon tracker to build your living dex, track shinies, forms, and progress across every game. Track 2064+ Pokémon in one place." />
  <meta name="twitter:image" content="/SiteLogo.png" />

  <!-- App / Theme -->
  <meta name="application-name" content="Ultimate Dex Tracker" />
  <meta name="theme-color" content="#0f0f0f" />

  <!-- Structured Data: WebSite + SiteLinksSearchBox -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ultimate Dex Tracker",
      "url": "https://www.ultimatedextracker.com/",
      "description": "A free Pokémon tracker to build your living dex, track shinies, forms, and progress across every game. Track 2064+ Pokémon in one place.",
      "publisher": {
        "@type": "Person",
        "name": "Antonic",
        "url": "https://solo.to/antonic"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.ultimatedextracker.com/trainers?query={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <!-- Structured Data: Named Sitelinks (hints Google toward these pages) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Ultimate Dex Tracker Navigation",
      "url": "https://www.ultimatedextracker.com/",
      "itemListElement": [
        {
          "@type": "SiteLinksSearchBox",
          "url": "https://www.ultimatedextracker.com/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.ultimatedextracker.com/trainers?query={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Login",
          "url": "https://www.ultimatedextracker.com/login",
          "description": "Sign in to your Ultimate Dex Tracker account"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Register",
          "url": "https://www.ultimatedextracker.com/register",
          "description": "Create a free account to track your Pokémon collection"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Counters",
          "url": "https://www.ultimatedextracker.com/counters",
          "description": "Track your shiny hunting encounters with live counters"
        },
        {
          "@type": "ListItem",
          "position": 4,
          "name": "Bingo",
          "url": "https://www.ultimatedextracker.com/bingo",
          "description": "Play Pokémon shiny hunt bingo with your collection"
        },
        {
          "@type": "ListItem",
          "position": 5,
          "name": "Trainers",
          "url": "https://www.ultimatedextracker.com/trainers",
          "description": "Browse and compare Pokémon collections from other trainers"
        }
      ]
    }
  </script>

</head>

<body>
  <noscript>
    <!-- Static content visible to search engines and crawlers when JavaScript is disabled -->
    <div
      style="padding: 40px; max-width: 1200px; margin: 0 auto; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; background: #1a1a2e;">
      <header style="text-align: center; margin-bottom: 40px;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Ultimate Dex Tracker</h1>
        <p style="font-size: 1.2rem; opacity: 0.9;">The Ultimate Pokémon Collection Tracker</p>
      </header>

      <main>
        <section style="margin-bottom: 40px;">
          <h2 style="font-size: 1.8rem; margin-bottom: 15px;">Welcome to Ultimate Dex Tracker!</h2>
          <p style="font-size: 1.1rem; line-height: 1.6;">Track your Pokémon collection across all games with ease.
            Build your perfect living dex and never lose track of your progress again. Currently tracking 2064+ Pokémon
            including all forms and variants!</p>
        </section>

        <section style="margin-bottom: 40px;">
          <h2 style="font-size: 1.5rem; margin-bottom: 15px;">Features</h2>
          <ul style="font-size: 1rem; line-height: 1.8; padding-left: 20px;">
            <li><strong>Track Progress:</strong> Track ball type, game caught, trainer info, and multiple forms for each
              Pokémon with visual progress bars.</li>
            <li><strong>Smart Filters:</strong> Filter by type, generation, game, ball type, trainer, forms, and caught
              status with advanced search.</li>
            <li><strong>Share & Compare:</strong> Share your profile link and view other trainers' collections to
              compare progress worldwide.</li>
            <li><strong>Personalize:</strong> Customize themes, set favorites, and backup your data with your unique
              trainer identity.</li>
            <li><strong>Shiny Tracking:</strong> Track all shiny Pokémon separately with dedicated shiny forms support.
            </li>
            <li><strong>Cloud Sync:</strong> Your data is safely stored in the cloud and accessible from any device.
            </li>
          </ul>
        </section>

        <section style="margin-bottom: 40px;">
          <h2 style="font-size: 1.5rem; margin-bottom: 15px;">Supported Pokémon Games</h2>
          <p style="font-size: 1rem; line-height: 1.6;">Track Pokémon from all mainline games including Scarlet &
            Violet, Legends Arceus, Sword & Shield, Let's Go Pikachu & Eevee, Sun & Moon, X & Y, Black & White, Diamond
            & Pearl, Ruby & Sapphire, Gold & Silver, and the original Red & Blue!</p>
        </section>

        <section style="margin-bottom: 40px;">
          <h2 style="font-size: 1.5rem; margin-bottom: 15px;">Get Started</h2>
          <p style="font-size: 1rem; line-height: 1.6;">Create a free account to start tracking your Pokémon collection
            today! Join thousands of trainers who use Ultimate Dex Tracker to complete their living dex.</p>
          <p style="margin-top: 20px;">
            <a href="/register"
              style="display: inline-block; padding: 12px 24px; background: #ffd700; color: #000; text-decoration: none; border-radius: 8px; font-weight: bold;">Register
              Free</a>
            <a href="/login"
              style="display: inline-block; padding: 12px 24px; background: transparent; color: #ffd700; text-decoration: none; border-radius: 8px; font-weight: bold; border: 2px solid #ffd700; margin-left: 10px;">Login</a>
          </p>
        </section>

        <section>
          <h2 style="font-size: 1.5rem; margin-bottom: 15px;">Browse Trainers</h2>
          <p style="font-size: 1rem; line-height: 1.6;">Explore other trainers' public profiles to see their collections
            and progress. Get inspired and compare your journey with fellow Pokémon enthusiasts!</p>
          <p style="margin-top: 15px;"><a href="/trainers" style="color: #ffd700;">View All Trainers →</a></p>
        </section>
      </main>

      <footer
        style="margin-top: 60px; padding-top: 20px; border-top: 1px solid #333; text-align: center; font-size: 0.9rem; opacity: 0.85;">
        <nav style="margin-bottom: 20px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
          <a href="/membership" style="color: #ffd700; text-decoration: underline;">Premium Membership & Pricing</a>
          <a href="/privacy" style="color: #ffd700; text-decoration: underline;">Privacy Policy</a>
          <a href="/terms" style="color: #ffd700; text-decoration: underline;">Terms of Service</a>
          <a href="/refund-policy" style="color: #ffd700; text-decoration: underline;">Refund Policy</a>
        </nav>
        <p>Made by Antonic | © 2024 Ultimate Dex Tracker</p>
        <p>Pokémon and Pokémon character names are trademarks of Nintendo.</p>
      </footer>
    </div>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
  <script>
    if (!window.location.pathname.startsWith('/overlay/') && !window.location.pathname.startsWith('/hunt-popout')) {
      kofiWidgetOverlay.draw('antonic111', {
        'type': 'floating-chat',
        'floating-chat.donateButton.text': 'Tip Me',
        'floating-chat.donateButton.background-color': '#323842',
        'floating-chat.donateButton.text-color': '#fff'
      });
    }
  </script>
  <style>
    /* Force Ko-Fi widget to bottom left */
    .floatingchat-container-wrap {
      left: 16px !important;
      right: auto !important;
    }

    .floating-chat-kofi-popup-iframe {
      left: 16px !important;
      right: auto !important;
    }

    body.popout-mode div[id^="kofi-widget-overlay"],
    body.popout-mode iframe[src*="ko-fi"],
    body.popout-mode .floatingchat-container-wrap,
    body.popout-mode .floatingchat-container-wrap-mobi,
    body.popout-mode .floating-chat-kofi-popup-iframe,
    body.admin-page div[id^="kofi-widget-overlay"],
    body.admin-page iframe[src*="ko-fi"],
    body.admin-page .floatingchat-container-wrap,
    body.admin-page .floatingchat-container-wrap-mobi,
    body.admin-page .floating-chat-kofi-popup-iframe,
    body.obs-overlay-mode div[id^="kofi-widget-overlay"],
    body.obs-overlay-mode iframe[src*="ko-fi"],
    body.obs-overlay-mode .floatingchat-container-wrap,
    body.obs-overlay-mode .floatingchat-container-wrap-mobi,
    body.obs-overlay-mode .floating-chat-kofi-popup-iframe,
    body.overlay-editor-active div[id^="kofi-widget-overlay"],
    body.overlay-editor-active iframe[src*="ko-fi"],
    body.overlay-editor-active .floatingchat-container-wrap,
    body.overlay-editor-active .floatingchat-container-wrap-mobi,
    body.overlay-editor-active .floating-chat-kofi-popup-iframe,
    body:has(.overlay-editor-studio-container) div[id^="kofi-widget-overlay"],
    body:has(.overlay-editor-studio-container) iframe[src*="ko-fi"],
    body:has(.overlay-editor-studio-container) .floatingchat-container-wrap,
    body:has(.overlay-editor-studio-container) .floatingchat-container-wrap-mobi,
    body:has(.overlay-editor-studio-container) .floating-chat-kofi-popup-iframe,
    body:has(.obs-overlay-viewport) div[id^="kofi-widget-overlay"],
    body:has(.obs-overlay-viewport) iframe[src*="ko-fi"],
    body:has(.obs-overlay-viewport) .floatingchat-container-wrap,
    body:has(.obs-overlay-viewport) .floatingchat-container-wrap-mobi,
    body:has(.obs-overlay-viewport) .floating-chat-kofi-popup-iframe,
    body:has(.admin-fullscreen-window) div[id^="kofi-widget-overlay"],
    body:has(.admin-fullscreen-window) iframe[src*="ko-fi"],
    body:has(.admin-fullscreen-window) .floatingchat-container-wrap,
    body:has(.admin-fullscreen-window) .floatingchat-container-wrap-mobi,
    body:has(.admin-fullscreen-window) .floating-chat-kofi-popup-iframe {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
  </style>
</body>

</html>
