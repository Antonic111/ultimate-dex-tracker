<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="earthOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="earthLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="earthGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="earthShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Atmosphere Glow Backing -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.3"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  
  <!-- Main Ocean Sphere with Filter -->
  <circle cx="256" cy="256" r="224" fill="url(#earthOcean)" filter="url(#earthShadow)"/>
  
  <!-- Grid Lines (Latitude/Longitude) -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.2" fill="none">
    <ellipse cx="256" cy="256" rx="224" ry="112"/>
    <ellipse cx="256" cy="256" rx="112" ry="224"/>
    <line x1="32" y1="256" x2="480" y2="256"/>
    <line x1="256" y1="32" x2="256" y2="480"/>
  </g>
  
  <!-- Continents / Landmasses (Clipped to Globe) -->
  <g clip-path="url(#globeClip)" fill="url(#earthLand)">
    <clipPath id="globeClip">
      <circle cx="256" cy="256" r="224"/>
    </clipPath>
    
    <!-- North America & Greenland -->
    <path d="M120 110 Q140 85 180 95 Q210 90 230 130 Q240 160 215 190 Q190 210 160 205 Q130 220 115 190 Q95 160 120 110 Z"/>
    <path d="M220 70 Q240 60 260 75 Q255 100 235 95 Z"/>
    <path d="M90 140 Q110 130 115 160 Q95 175 80 155 Z"/>
    
    <!-- South America -->
    <path d="M185 240 Q225 245 235 285 Q245 340 215 385 Q190 415 180 435 Q170 410 175 365 Q165 315 160 280 Q160 250 185 240 Z"/>
    
    <!-- Europe & Asia -->
    <path d="M280 115 Q320 95 375 105 Q430 110 460 160 Q450 205 410 220 Q370 235 345 205 Q320 210 295 180 Q270 150 280 115 Z"/>
    <path d="M285 170 Q305 160 320 180 Q310 200 285 195 Z"/>
    <path d="M420 190 Q450 185 465 220 Q440 240 415 215 Z"/>
    
    <!-- Africa -->
    <path d="M275 225 Q320 215 350 245 Q365 295 340 350 Q315 395 295 385 Q270 330 260 285 Q260 245 275 225 Z"/>
    <path d="M360 335 Q375 330 375 360 Q360 370 355 345 Z"/>
    
    <!-- Australia / Oceania -->
    <path d="M400 330 Q445 320 465 355 Q450 395 415 390 Q390 375 395 345 Z"/>
    <path d="M465 400 Q480 395 475 415 Q460 420 465 400 Z"/>
  </g>
  
  <!-- 3D Shading & Specular Highlight Overlay -->
  <circle cx="256" cy="256" r="224" fill="url(#earthGlow)" pointer-events="none"/>
</svg>
